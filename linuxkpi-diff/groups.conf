# Consumer groups: Linux code that FreeBSD carries itself on top of LinuxKPI.
#
#   <group>   <prefix> [<prefix> ...]
#
# Prefixes are Linux source/build paths.  A module or header belongs to the
# group with the longest matching prefix; a "!prefix" excludes paths from
# that group (they then fall through to shorter prefixes of other groups,
# or to no group).  Groups are hierarchical by "/": reports are produced
# for every leaf group and for every parent ("drm", "wifi") as the union of
# its children.  Anything not in a group is a provider (LinuxKPI's job).

# drm-kmod (ports/graphics/drm-kmod)
drm/core        drivers/gpu/drm/ include/drm/ include/uapi/drm/ !drivers/gpu/drm/virtio/
drm/ttm         drivers/gpu/drm/ttm/
drm/sched       drivers/gpu/drm/scheduler/
drm/amdgpu      drivers/gpu/drm/amd/
drm/radeon      drivers/gpu/drm/radeon/
drm/i915        drivers/gpu/drm/i915/
drm/xe          drivers/gpu/drm/xe/

# Wireless drivers in sys/contrib/dev (mac80211/cfg80211 are providers:
# linuxkpi_wlan implements them)
wifi/iwlwifi    drivers/net/wireless/intel/iwlwifi/
wifi/mt76       drivers/net/wireless/mediatek/mt76/
wifi/rtw88      drivers/net/wireless/realtek/rtw88/
wifi/rtw89      drivers/net/wireless/realtek/rtw89/
wifi/ath        drivers/net/wireless/ath/
wifi/ath10k     drivers/net/wireless/ath/ath10k/
wifi/ath11k     drivers/net/wireless/ath/ath11k/
wifi/ath12k     drivers/net/wireless/ath/ath12k/
wifi/brcm80211  drivers/net/wireless/broadcom/brcm80211/
